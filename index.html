<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NoNa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- المتغيرات العامة والتنسيق الأساسي --- */
        :root {
            --primary-color: #ff758c; /* اللون الوردي الأساسي */
            --secondary-color: #ff7eb3; /* اللون الوردي الثانوي */
            --bg-dark: #0b090c; /* الخلفية الداكنة */
            --card-bg: rgba(20, 15, 25, 0.85); /* خلفية البطاقة الشفافة */
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.2);
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.9);
            --font-main: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- الخلفية والتمويه --- */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* رابط الخلفية المغبشة الجديد */
            background-image: url('https://i.postimg.cc/C1k2C9v7/IMG-4523-1.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.4);
            transform: scale(1.1);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* --- الحاوية الرئيسية --- */
        .wrapper {
            width: 100%;
            max-width: 550px;
            z-index: 2;
        }

        /* --- تنسيق البطاقات العامة --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(20px);
            text-align: center;
            animation: fadeIn 0.8s ease;
            display: none; /* مخفية افتراضياً حتى يتم تسجيل الدخول */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- أيقونة الظرف --- */
        .envelope-graphic {
            background: rgba(255, 255, 255, 0.1);
            width: 170px;
            height: 115px;
            margin: 0 auto 25px auto;
            position: relative;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .envelope-graphic::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 85px solid transparent;
            border-right: 85px solid transparent;
            border-top: 60px solid rgba(255, 117, 140, 0.5);
        }

        .heart-seal {
            font-size: 32px;
            position: relative;
            z-index: 2;
            background: var(--primary-color);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* --- العناصر المشتركة (Titles, Buttons, Inputs) --- */
        h2 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(255, 117, 140, 0.5);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        input.text-input {
            padding: 14px 20px;
            width: 85%;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: rgba(0, 0, 0, 0.6);
            color: var(--text-light);
            font-family: var(--font-main);
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-light);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.5);
            transition: all 0.3s ease;
            margin-top: 15px;
            font-family: var(--font-main);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        #errorMsg {
            color: #ff5252;
            font-size: 15px;
            margin-top: 12px;
            font-weight: 700;
        }

        /* --- تنسيق الخطوات --- */
        .step-content {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        .active-step {
            display: block;
        }

        /* --- الصفحة 2: الرسالة --- */
        .typed-message {
            font-size: 16px;
            line-height: 1.9;
            color: var(--text-light);
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            text-align: right;
            min-height: 190px;
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-line;
            margin-bottom: 20px;
            direction: rtl;
        }

        /* --- الصفحة 3: العداد --- */
        .timer-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            background: rgba(0, 0, 0, 0.5);
            padding: 22px;
            border-radius: 15px;
            border: 1px dashed rgba(255, 235, 59, 0.6);
            margin-bottom: 25px;
        }

        /* --- الصفحة 4: الجاليري الجديد --- */
        .slider-container {
            position: relative;
            width: 100%;
            height: 350px;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: #050507;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.4);
        }

        .slider-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .slider-container img:hover {
            transform: scale(1.03);
        }

        .slider-container img.active-img {
            display: block;
        }

        .slider-btns {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            padding: 0 15px;
            pointer-events: none;
            z-index: 10;
        }

        .slider-btns button {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            color: var(--text-light);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .slider-btns button:hover {
            background: var(--primary-color);
        }

        /* --- نافذة التكبير (Modal) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px 50px 20px;
        }

        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 117, 140, 0.6);
        }

        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .modal-nav-btn:hover {
            background: var(--primary-color);
        }

        .modal-prev { right: 25px; }
        .modal-next { left: 25px; }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 25px;
            color: var(--text-light);
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: 0.3s;
        }

        .close-modal:hover {
            background: #ff5252;
        }

        /* --- الصفحة الأخيرة: الرسالة النهائية --- */
        .final-msg {
            font-size: 30px;
            font-weight: bold;
            color: var(--primary-color);
            line-height: 1.7;
            margin: 30px 0;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.7);
        }

        /* --- استعلامات الوسائط (Mobile Responsiveness) --- */
        @media (max-width: 600px) {
            h2 { font-size: 22px; }
            .card { padding: 30px 15px; }
            .typed-message { font-size: 14px; min-height: 160px; }
            .timer-box { font-size: 14px; padding: 15px; }
            .slider-container { height: 250px; }
            .envelope-graphic { width: 140px; height: 95px; }
            .envelope-graphic::before { border-left: 70px solid transparent; border-right: 70px solid transparent; border-top: 50px solid rgba(255, 117, 140, 0.5); }
            .heart-seal { width: 40px; height: 40px; font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
