<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NoNa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b090c;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الموقع المغبشة */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* تم تحديث الخلفية لتتناسب مع المجموعة الجديدة */
            background-image: url('https://i.postimg.cc/Xq8H1gP2/new-bg.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.45);
            transform: scale(1.1);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 550px;
            z-index: 2;
        }
        
        .card {
            background: rgba(20, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .envelope-graphic {
            background: rgba(255, 255, 255, 0.08);
            width: 170px;
            height: 115px;
            margin: 0 auto 20px auto;
            position: relative;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .envelope-graphic::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 85px solid transparent;
            border-right: 85px solid transparent;
            border-top: 60px solid rgba(255, 117, 140, 0.4);
        }
        .heart-seal {
            font-size: 32px;
            position: relative;
            z-index: 2;
            background: #ff758c;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff758c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        input {
            padding: 14px 20px;
            width: 85%;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .step-content {
            display: none;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }
        .active-step {
            display: block;
        }
        
        h2 {
            color: #ff758c;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,117,140,0.3);
        }
        
        .typed-message {
            font-size: 15px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: right;
            min-height: 170px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-line;
            margin-bottom: 20px;
        }
        
        .timer-box {
            font-size: 17px;
            font-weight: bold;
            color: #ffeb3b;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed rgba(255,235,59,0.4);
            margin-bottom: 25px;
        }
        
        /* تنسيق الجاليري الجديد */
        .slider-container {
            position: relative;
            width: 100%;
            height: 350px; /* تم زيادة الطول قليلاً لعرض الصور بشكل أفضل */
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3); /* إطار أوضح */
            background: #050507;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.3);
        }
        .slider-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* الحفاظ على أبعاد الصور */
            display: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .slider-container img:hover {
            transform: scale(1.05); /* تأثير تكبير بسيط عند التحويم */
        }
        .slider-container img.active-img {
            display: block;
        }
        .slider-btns {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            padding: 0 10px;
            pointer-events: none;
            z-index: 10;
        }
        .slider-btns button {
            pointer-events: auto;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .slider-btns button:hover {
            background: #ff758c;
            color: white;
        }

        /* نافذة التكبير (Fullscreen Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98); /* خلفية أغمق للمودال */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 15px 40px 15px;
        }
        .modal img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 117, 140, 0.6);
        }
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .modal-nav-btn:hover {
            background: #ff758c;
        }
        .modal-prev { right: 20px; }
        .modal-next { left: 20px; }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px; /* تم تعديل مكان زر الإغلاق ليصبح في اليمين */
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: 0.3s;
        }
        .close-modal:hover {
            background: #ff5252;
        }

        /* تنسيق قسم خط السير (Timeline) */
        .timeline-container {
            display: none;
            margin: 20px auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: right;
            direction: rtl;
            animation: fadeIn 0.5s ease-in-out;
        }

        .timeline {
            position: relative;
            padding-right: 25px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            right: 8px;
            top: 5px;
            bottom: 5px;
            width: 3px;
            background: #ff758c;
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            right: -21px;
            top: 5px;
            width: 12px;
            height: 12px;
            background: white;
            border: 3px solid #ff758c;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.8);
        }

        .timeline-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .timeline-content h4 {
            margin: 0 0 3px;
            color: #333;
            font-size: 16px;
        }

        .timeline-content span {
            color: #ff758c;
            font-size: 14px;
            font-weight: bold;
        }

        .timeline-end {
            text-align: center;
            font-weight: bold;
            color: #ff758c;
            font-size: 16px;
            margin-top: 15px;
        }

        .final-msg {
            font-size: 24px;
            font-weight: bold;
            color: #ff758c;
            line-height: 1.8;
            margin: 25px 0;
            text-shadow: 0 0 15px rgba(255,117,140,0.5);
        }
        #errorMsg {
            color: #ff5252;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
