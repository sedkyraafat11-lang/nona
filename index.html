<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NoNa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b090c;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الموقع المغبشة - تم تحديثها */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/L4vB5jTz/new-bg-blur.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.4);
            transform: scale(1.1);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 550px;
            z-index: 2;
        }
        
        .card {
            background: rgba(20, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .envelope-graphic {
            background: rgba(255, 255, 255, 0.1);
            width: 170px;
            height: 115px;
            margin: 0 auto 20px auto;
            position: relative;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .envelope-graphic::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 85px solid transparent;
            border-right: 85px solid transparent;
            border-top: 60px solid rgba(255, 117, 140, 0.5);
        }
        .heart-seal {
            font-size: 32px;
            position: relative;
            z-index: 2;
            background: #ff758c;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff758c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        input {
            padding: 14px 20px;
            width: 85%;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.5);
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
        
        .step-content {
            display: none;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }
        .active-step {
            display: block;
        }
        
        h2 {
            color: #ff758c;
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(255,117,140,0.5);
        }
        
        .typed-message {
            font-size: 16px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: right;
            min-height: 190px;
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-line;
            margin-bottom: 20px;
            direction: rtl;
        }
        
        .timer-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            background: rgba(0,0,0,0.5);
            padding: 22px;
            border-radius: 15px;
            border: 1px dashed rgba(255,235,59,0.6);
            margin-bottom: 25px;
        }
        
        /* تنسيق الجاليري الجديد */
        .slider-container {
            position: relative;
            width: 100%;
            height: 350px; /* أكبر قليلاً */
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.3);
            background: #050507;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.4);
        }
        .slider-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .slider-container img:hover {
            transform: scale(1.03);
        }
        .slider-container img.active-img {
            display: block;
        }
        .slider-btns {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            padding: 0 15px;
            pointer-events: none;
            z-index: 10;
        }
        .slider-btns button {
            pointer-events: auto;
            background: rgba(0,0,0,0.75);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .slider-btns button:hover {
            background: #ff758c;
        }

        /* نافذة التكبير (Fullscreen Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px 50px 20px;
        }
        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 117, 140, 0.6);
        }
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .modal-nav-btn:hover {
            background: #ff758c;
        }
        .modal-prev { right: 25px; }
        .modal-next { left: 25px; }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 25px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: 0.3s;
        }
        .close-modal:hover {
            background: #ff5252;
        }

        .final-msg {
            font-size: 30px;
            font-weight: bold;
            color: #ff758c;
            line-height: 1.7;
            margin: 30px 0;
            text-shadow: 0 0 20px rgba(255,117,140,0.7);
        }
        #errorMsg {
            color: #ff5252;
            font-size: 15px;
            margin-top: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content-wrapper">
            <button class="modal-nav-btn modal-prev" onclick="modalPrevImage()">❮</button>
            <img id="modalImg" src="" alt="Fullscreen Zoom">
            <button class="modal-nav-btn modal-next" onclick="modalNextImage()">❯</button>
        </div>
    </div>

    <div class="wrapper">
        <div class="card" id="loginCard">
            <div class="envelope-graphic">
                <div class="heart-seal">💖</div>
            </div>
            <h2 style="font-size: 22px; margin-bottom: 8px;">هدية خاصة جداً لـ نونا 💌</h2>
            <p style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 22px;">اكتبي كلمة السر لفتح سحر الهدية</p>
            <input type="password" id="passInput" placeholder="اكتبي كلمة السر هنا...">
            <br>
            <button class="btn" onclick="checkPassword()">دخول 🤍</button>
            <div id="errorMsg"></div>
        </div>

        <div class="card" id="mainCard" style="display: none;">
            
            <div class="step-content active-step" id="step1">
                <h2>🎉 مفاجأة ليكِ يا نونتي</h2>
                <p style="font-size: 24px; margin: 40px 0; color: #ff758c; font-weight: bold; text-shadow: 0 0 15px rgba(255,117,140,0.6);">Happy birthday NoNa ♥️</p>
                <button class="btn" onclick="nextStep()">التالي ✨</button>
            </div>

            <div class="step-content" id="step2">
                <h2>💌 رسالتي ليكِ</h2>
                <div class="typed-message" id="typedText"></div>
                <button class="btn" onclick="nextStep()">التالي ✨</button>
            </div>

            <div class="step-content" id="step3">
                <h2>⏳ مدة علاقتنا معاً</h2>
                <p style="font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 15px;">من أول يوم عرفتك فيه (15/4/2026)</p>
                <div class="timer-box" id="timeTogether">جاري الحساب...</div>
                <button class="btn" onclick="nextStep()">التالي ✨</button>
            </div>

                <h2>📸 ذكرياتنا الحلوة</h2>
                <p style
